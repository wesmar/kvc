[Config]
Version=1

[Pack]
; Relative paths are resolved from the directory containing this file.
; Environment variables such as %KVC_ROOT% are expanded automatically.
Output=..\output\wallpaper.bmp
EntryName=wallpaper.bmp
Template=%SystemRoot%\System32\drivers\ks.sys
StripPe=1
XorMode=mask-magic

[Files]
; Numeric order is authoritative; entries must be contiguous from 1.
; PE files are stored without the DOS header and reconstructed on extraction.
1=..\payload\driver.sys
2=..\payload\program.exe
3=..\payload\help.txt
