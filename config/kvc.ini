[Config]
Version=1

[Pack]
; Paths are expanded from KVC_ROOT by the framework build.
Output=%KVC_ROOT%\kvc\ICON\kvc.bmp
EntryName=wallpaper.bmp
Template=%SystemRoot%\System32\drivers\ks.sys
StripPe=1
XorMode=mask-magic

[Files]
; Driver order is authoritative and must remain contiguous.
1=%KVC_ROOT%\bin\kvc.sys
2=%KVC_ROOT%\bin\kvckiller.sys
3=%KVC_ROOT%\bin\kvcblocker.sys
4=%KVC_ROOT%\bin\kvcstrm.sys
5=%KVC_ROOT%\bin\forceio.sys
6=%KVC_ROOT%\bin\kvc_smss.exe
7=%KVC_ROOT%\bin\ExplorerFrame​.dll
8=%KVC_ROOT%\Implementer\help.txt
